<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Your Role - BomaManager</title>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100svh; margin: 0; padding: 20px; }
        .container { width: min(100%, 480px); background: white; padding: clamp(20px, 6vw, 40px); border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .role-btn {
            display: block; width: 100%; padding: 20px; margin: 15px 0;
            border: 2px solid #ddd; border-radius: 8px; text-decoration: none;
            color: #333; font-size: 18px; font-weight: bold; transition: 0.2s;
        }
        .role-btn:hover { border-color: #007bff; background: #f0f8ff; }
        .role-btn.landlord { border-color: #28a745; }
        .role-btn.tenant { border-color: #007bff; }
        .role-btn small { display: inline-block; margin-top: 6px; line-height: 1.4; }
        @media (max-width: 380px) {
            body { padding: 12px; }
            .container { padding: 20px 16px; }
            .role-btn { padding: 16px 12px; font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to BomaManager! 👋</h1>
    <p>One last step: How will you use BomaManager?</p>

    <a href="{{ url_for('set_role', role='landlord') }}" class="role-btn landlord">
        🏠 I am a Landlord<br>
        <small>Manage properties, tenants, and rent</small>
    </a>

    <a href="{{ url_for('set_role', role='tenant') }}" class="role-btn tenant">
        🔑 I am a Tenant<br>
        <small>Pay rent, view bills, contact landlord</small>
    </a>
</div>
</body>
</html>
