<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - BomaManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<div class="container auth-shell">
    <div class="auth-card">
        <h1>Set a new password</h1>
        <p class="helper-text">This is required before you can continue.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            {% if current_user.must_change_password %}
                <label for="current_password">Current temporary password</label>
                <input type="password" id="current_password" name="current_password" placeholder="temp123" required>
            {% endif %}

            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Minimum 6 characters" required>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>

            <button type="submit" class="btn primary-action">Update password</button>
        </form>
    </div>
</div>
</body>
</html>
