<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Room - BomaManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<div class="container">
    <h1>{{ 'Edit Room' if room else 'Add Room' }} {{ 'in ' + prop.name if room else 'to ' + prop.name }}</h1>
    <form method="POST">
        <input type="text" name="room_number" placeholder="Room Number e.g. A1" value="{{ room.room_number if room else '' }}" {% if room %}readonly{% endif %} required>
        <input type="number" name="rent" placeholder="Rent Amount" value="{{ room.rent_amount if room else '' }}" min="1" step="0.01" required>
        <button type="submit">{{ 'Save rent amount' if room else 'Add Room' }}</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <p><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
</div>
</body>
</html>
