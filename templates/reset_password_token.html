<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - BomaManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<div class="container auth-shell">
    <div class="auth-card">
        <h1>Reset Password</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="token">Reset token</label>
            <input type="text" id="token" name="token" value="{{ token or '' }}" required>

            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Minimum 6 characters" required>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required>

            <button type="submit" class="btn primary-action">Update password</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login') }}">Back to login</a>
        </div>
    </div>
</div>
</body>
</html>
