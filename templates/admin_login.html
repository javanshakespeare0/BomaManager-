<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BomaManager Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top right, #21423b 0, #111c1b 48%);
      color: #ecf3f1;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: clamp(22px, 6vw, 38px);
      border: 1px solid #38504c;
      border-radius: 18px;
      background: rgba(27, 44, 43, .94);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .28);
    }
    h1 { margin: 0 0 8px; font: 700 clamp(1.5rem, 6vw, 2rem) Georgia, serif; }
    p { margin: 0 0 24px; color: #a9bfba; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-size: .9rem; font-weight: 700; }
    input, button { width: 100%; min-height: 46px; border-radius: 8px; font: inherit; }
    input { padding: 12px; border: 1px solid #506b65; background: #162725; color: #ecf3f1; }
    button { margin-top: 22px; padding: 12px 16px; border: 0; background: #26796d; color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #35a08f; }
    @media (max-width: 380px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>BomaManager Admin</h1>
    <p>Sign in to manage the platform.</p>
    <form method="POST">
      <label for="admin-email">Admin email</label>
      <input id="admin-email" type="email" name="email" autocomplete="username" required>
      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
