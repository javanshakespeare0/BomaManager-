<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include '_favicon.html' %}
    <title>Login - BomaManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<div class="container auth-shell">
    <div class="auth-card">
        <a class="brand-lockup" href="{{ url_for('login') }}" aria-label="BomaManager home">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="" aria-hidden="true">
            <span>BomaManager</span>
        </a>
        <h1>Welcome back</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" placeholder="Email" autocomplete="username" required>
            <div class="password-field">
                <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Show password" aria-pressed="false" title="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="eye-slash" d="m3 3 18 18"></path>
                    </svg>
                </button>
            </div>
            <button type="submit" class="btn auth-submit">
                Login
            </button>
        </form>

        <div class="divider">OR</div>

        <a href="{{ url_for('google_login') }}" class="google-btn">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_64dp.png" alt="Google logo">
            Sign in with Google
        </a>

        <a href="{{ url_for('google_login') }}?register=true" class="google-btn google-btn--register">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_64dp.png" alt="Google logo">
            Register with Google
        </a>
        <a href="{{ url_for('forgot_password') }}" class="auth-inline-link">Forgot password?</a>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
</div>
<script>
    const loginPassword = document.getElementById('login-password');
    const toggleLoginPassword = document.getElementById('toggle-login-password');
    toggleLoginPassword.addEventListener('click', function () {
        const isVisible = loginPassword.type === 'text';
        loginPassword.type = isVisible ? 'password' : 'text';
        toggleLoginPassword.setAttribute('aria-pressed', String(!isVisible));
        toggleLoginPassword.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        toggleLoginPassword.title = isVisible ? 'Show password' : 'Hide password';
    });
</script>
</body>
</html>
